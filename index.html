<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de IMC</title>
    <style>
        body {
            background-color: hsl(60, 100%, 50%); /* Amarelo */
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        form {
            background-color: #FFFFFF;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        h1 {
            color: #FF0000; /* Vermelho */
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            color: #000000; /* Preto */
        }
        input {
            width: 90%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ff0000; /* Borda vermelha */
            border-radius: 5px;
        }
        button {
            background-color: #FF0000; /* Vermelho */
            color: #FFFFFF;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #CC0000; /* Vermelho mais escuro */
        }
    </style>
</head>
<body>
    <form method="post">
        <h1>Calculadora de IMC</h1>
        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" name="peso" step="0.1" required>
        <label for="altura">Altura (m):</label>
        <input type="number" id="altura" name="altura" step="0.01" required>
        <button type="button" onclick="calcularIMC()">Calcular IMC</button>
        <h2 id="resultado"></h2>
    </form>
</body>
</html>
<script src="script.js"></script>
