<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IMC</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;

            background-color: yellow;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }
.container {
    width: 100%;

    background-color: white;

    padding: 25px;

    border-radius: 15px;

    box-shadow: 0 0 15px rgba(0,0,0,0.1);
}

        h1 {
            text-align: center;
            color: red;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-bottom: 8px;
            margin-top: 15px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid red;
            border-radius: 8px;

            font-size: 16px;
        }

        button {
            width: 100%;

            margin-top: 20px;

            padding: 14px;

            border: none;
            border-radius: 8px;

            background-color: red;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background-color: darkred;
        }

        #resultado {
            text-align: center;

            margin-top: 20px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Calculadora IMC</h1>

        <label for="peso">Peso (kg)</label>
        <input type="number" id="peso" step="0.1" placeholder="Ex: 70">

        <label for="altura">Altura (m)</label>
        <input type="number" id="altura" step="0.01" placeholder="Ex: 1.70">

        <button onclick="calcularIMC()">
            Calcular IMC
        </button>

        <h2 id="resultado"></h2>

    </div>

    <script src="script.js"></script>

</body>
</html>
