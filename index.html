<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora IMC</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;

            background-color: yellow;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: stretch;

            min-height: 100vh;
        }

        .container {
            width: 100%;
            min-height: 80vh;

            background-color: white;

            padding: 30px 25px;

            border-radius: 20px;

            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            text-align: center;
            color: red;

            margin-bottom: 30px;

            font-size: 32px;
        }

        label {
            display: block;

            margin-top: 15px;
            margin-bottom: 8px;

            font-weight: bold;

            font-size: 18px;
        }

        input {
            width: 100%;

            padding: 16px;

            border: 2px solid red;
            border-radius: 10px;

            font-size: 18px;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 16px;

            border: none;
            border-radius: 10px;

            background-color: red;
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background-color: darkred;
        }

        #resultado {
            text-align: center;

            margin-top: 25px;

            font-size: 22px;
            font-weight: bold;
        }

        @media (min-width: 768px) {
            .container {
                max-width: 500px;
                min-height: auto;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Calculadora IMC</h1>

        <label for="peso">Peso (kg)</label>
        <input type="number" id="peso" step="0.1" placeholder="Ex: 70">

        <label for="altura">Altura (m)</label>
        <input type="number" id="altura" step="0.01" placeholder="Ex: 1.70">

        <button onclick="calcularIMC()">
            Calcular IMC
        </button>

        <h2 id="resultado"></h2>

    </div>

    <script src="script.js"></script>

</body>

</html>
